<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ROYAL MOD - 8 Ball Pool</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #080808, #1a1a1a, #080808);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #111;
            border: 1px solid #333;
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.08);
        }

        .logo {
            width: 110px;
            height: 110px;
            object-fit: contain;
            border-radius: 50%;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .step {
            background: #181818;
            border: 1px solid #292929;
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 15px;
            text-align: left;
        }

        .step h2 {
            font-size: 18px;
            margin-bottom: 12px;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        button,
        .downloadBtn {
            border: none;
            border-radius: 10px;
            padding: 12px 15px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: 0.2s;
        }

        .socialBtn {
            background: white;
            color: black;
            flex: 1;
        }

        .verifyBtn {
            background: #333;
            color: white;
            flex: 1;
        }

        button:hover,
        .downloadBtn:hover {
            transform: scale(1.03);
            opacity: 0.9;
        }

        .locked {
            opacity: 0.45;
            pointer-events: none;
        }

        .hidden {
            display: none;
        }

        .passwordBox {
            margin-top: 20px;
            background: #181818;
            border: 1px solid #292929;
            border-radius: 15px;
            padding: 20px;
            text-align: left;
        }

        .passwordBox h2 {
            font-size: 18px;
            margin-bottom: 12px;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid #444;
            background: #0c0c0c;
            color: white;
            outline: none;
            font-size: 16px;
            margin-bottom: 10px;
        }

        input:focus {
            border-color: white;
        }

        .unlockBtn {
            width: 100%;
            background: white;
            color: black;
        }

        .downloadBox {
            margin-top: 20px;
        }

        .downloadBtn {
            display: block;
            width: 100%;
            background: #00c853;
            color: white;
            font-size: 18px;
        }

        .message {
            text-align: center;
            margin-top: 10px;
            font-size: 13px;
            color: #aaa;
        }

        .success {
            color: #00e676;
        }

        .error {
            color: #ff5252;
        }

        @media (max-width: 450px) {
            .container {
                padding: 25px 15px;
            }

            h1 {
                font-size: 26px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- LOGO -->
    <img src="royal-mod.png" class="logo" alt="Royal Mod">

    <h1>ROYAL MOD</h1>

    <p class="subtitle">
        Complete the steps below to unlock the download.
    </p>


    <!-- STEP 1 -->
    <div class="step" id="step1">

        <h2>YouTube</h2>

        <div class="buttons">

            <button
                class="socialBtn"
                onclick="openYouTube()">
                Subscribe
            </button>

            <button
                class="verifyBtn"
                onclick="verifyStep1()">
                Verify
            </button>

        </div>

    </div>


    <!-- STEP 2 -->
    <div class="step locked" id="step2">

        <h2>Telegram</h2>

        <div class="buttons">

            <button
                class="socialBtn"
                onclick="openTelegram()">
                Join
            </button>

            <button
                class="verifyBtn"
                onclick="verifyStep2()">
                Verify
            </button>

        </div>

    </div>


    <!-- STEP 3 -->
    <div class="step locked" id="step3">

        <h2>Instagram</h2>

        <div class="buttons">

            <button
                class="socialBtn"
                onclick="openInstagram()">
                Follow
            </button>

            <button
                class="verifyBtn"
                onclick="verifyStep3()">
                Verify
            </button>

        </div>

    </div>


    <!-- PASSWORD -->
    <div class="passwordBox hidden" id="passwordBox">

        <h2>Enter Password</h2>

        <input
            type="password"
            id="password"
            placeholder="Enter password">

        <button
            class="unlockBtn"
            onclick="unlockDownload()">
            Unlock
        </button>

        <p id="passwordMessage" class="message"></p>

    </div>


    <!-- DOWNLOAD -->
    <div class="downloadBox hidden" id="downloadBox">

        <a
            class="downloadBtn"
            href="https://github.com/royal-mod/8-Ball-Auto-aim---play/releases/download/v1.0/kEngine3.4.apk"
            target="_blank"
            rel="noopener">
            Download
        </a>

        <p class="message success">
            Your download is unlocked!
        </p>

    </div>

</div>


<script>

    /* =========================
       SOCIAL LINKS
    ========================= */

    function openYouTube() {
        window.open(
            "https://www.youtube.com/@Royal_mod-89",
            "_blank"
        );
    }


    function openTelegram() {
        window.open(
            "https://t.me/royal_mod89",
            "_blank"
        );
    }


    function openInstagram() {
        window.open(
            "https://www.instagram.com/royalmod_89/",
            "_blank"
        );
    }


    /* =========================
       STEP 1
    ========================= */

    function verifyStep1() {

        document.getElementById("step2")
            .classList.remove("locked");

        alert("Step 1 verified!");

    }


    /* =========================
       STEP 2
    ========================= */

    function verifyStep2() {

        document.getElementById("step3")
            .classList.remove("locked");

        alert("Step 2 verified!");

    }


    /* =========================
       STEP 3
    ========================= */

    function verifyStep3() {

        document.getElementById("passwordBox")
            .classList.remove("hidden");

        alert("Step 3 verified!");

    }


    /* =========================
       PASSWORD
    ========================= */

    function unlockDownload() {

        const password =
            document.getElementById("password").value;

        const message =
            document.getElementById("passwordMessage");


        if (password === "1640") {

            document.getElementById("downloadBox")
                .classList.remove("hidden");

            message.textContent =
                "Password correct!";

            message.className =
                "message success";

        } else {

            message.textContent =
                "Wrong password!";

            message.className =
                "message error";

        }

    }

</script>

</body>
</html>
